<a routerLink="/admin/produtos">← Voltar</a>
<h1>{{ id() ? 'Editar produto' : 'Novo produto' }}</h1>

<form class="form" [formGroup]="form" (ngSubmit)="salvar()">
  <label class="inteiro">
    Nome *
    <input type="text" formControlName="nome" />
    @if (form.controls.nome.touched && form.controls.nome.invalid) {
      <small class="erro">Informe o nome do produto.</small>
    }
  </label>

  <label class="inteiro">
    Descrição
    <textarea rows="4" formControlName="descricao"></textarea>
  </label>

  <label>
    Categoria
    <select formControlName="categoria_id">
      <option [ngValue]="null">Sem categoria</option>
      @for (c of categorias(); track c.id) {
        <option [ngValue]="c.id">{{ c.nome }}</option>
      }
    </select>
  </label>

  <label>
    Marca
    <input type="text" formControlName="marca" />
  </label>

  <label>
    Preço (R$)
    <input type="number" step="0.01" min="0" formControlName="preco" />
  </label>

  <label>
    Gênero
    <select formControlName="genero">
      <option value="">Não informado</option>
      <option value="feminino">Feminino</option>
      <option value="masculino">Masculino</option>
      <option value="unissex">Unissex</option>
      <option value="infantil">Infantil</option>
    </select>
  </label>

  <label>
    Material
    <input type="text" formControlName="material" placeholder="Ex.: Acetato" />
  </label>

  <label>
    Formato
    <input type="text" formControlName="formato" placeholder="Ex.: Redondo" />
  </label>

  <label>
    Cor
    <input type="text" formControlName="cor" />
  </label>

  <div class="checks">
    <label class="check"
      ><input type="checkbox" formControlName="destaque" /> Destaque na página inicial</label
    >
    <label class="check"
      ><input type="checkbox" formControlName="ativo" /> Visível no catálogo</label
    >
  </div>

  <fieldset class="inteiro imagens">
    <legend>Imagens</legend>
    <div class="imagens__lista">
      @for (img of imagens(); track img) {
        <div class="imagens__item">
          <img [src]="img" alt="Imagem do produto" />
          <button type="button" (click)="removerImagem(img)" aria-label="Remover imagem">×</button>
        </div>
      }
    </div>
    <input
      type="file"
      accept="image/*"
      multiple
      (change)="adicionarImagens($event)"
      [disabled]="enviandoImagem()"
    />
    @if (enviandoImagem()) {
      <small>Enviando imagem...</small>
    }
  </fieldset>

  @if (erro()) {
    <p class="erro inteiro">{{ erro() }}</p>
  }

  <div class="inteiro botoes">
    <a routerLink="/admin/produtos" class="btn btn--secundario">Cancelar</a>
    <button type="submit" class="btn" [disabled]="salvando() || enviandoImagem()">
      {{ salvando() ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</form>
