<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="entrar()">
    <h1>Área da ótica</h1>
    <p>Entre para gerenciar os produtos do catálogo.</p>

    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label>
      Senha
      <input type="password" formControlName="senha" autocomplete="current-password" />
    </label>

    @if (erro()) {
      <p class="erro">{{ erro() }}</p>
    }

    <button class="btn" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando...' : 'Entrar' }}
    </button>
    <a routerLink="/">← Voltar ao site</a>
  </form>
</div>
