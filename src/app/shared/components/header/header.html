<header class="header">
  <div class="container header__conteudo">
    <a routerLink="/" class="header__logo">Kat <span>Ótica</span></a>

    <button
      class="header__menu-btn"
      type="button"
      aria-label="Abrir menu"
      [attr.aria-expanded]="menuAberto()"
      (click)="alternarMenu()"
    >
      ☰
    </button>

    <nav class="header__nav" [class.aberto]="menuAberto()">
      <a
        routerLink="/"
        routerLinkActive="ativo"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuAberto.set(false)"
        >Início</a
      >
      <a routerLink="/catalogo" routerLinkActive="ativo" (click)="menuAberto.set(false)"
        >Catálogo</a
      >
      <a routerLink="/sobre" routerLinkActive="ativo" (click)="menuAberto.set(false)">Sobre</a>
    </nav>
  </div>
</header>
